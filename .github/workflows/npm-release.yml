name: NPM Release

on:
  release:
    types: [ released ]

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Get release version
        id: get_version
        run: |
          RELEASE_VERSION="${{ github.event.release.tag_name }}"
          CLEAN_VERSION="${RELEASE_VERSION#v}"
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $CLEAN_VERSION"

      - name: Update package.json version
        run: |
          npm version ${{ steps.get_version.outputs.version }} --no-git-tag-version

      - name: Create .npmrc for scoped package
        run: |
          cat << EOF > .npmrc
          //registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}
          @androlax2:registry=https://registry.npmjs.org/
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "chore: update version to ${{ steps.get_version.outputs.version }}"
          file_pattern: package.json
